<rect x="84" y="778" width="16" height="14" rx="2" class="model" fill="#EDF2F9" stroke="#0B3C86" stroke-width="1.6"/>
<text x="106" y="790" class="l" font-size="12.5" fill="#3D4B5D">model</text>
<rect x="166" y="778" width="24" height="14" rx="7" class="gate" fill="#FBF1D6" stroke="#A57700" stroke-width="1.4"/>
<text x="196" y="790" class="l" font-size="12.5" fill="#3D4B5D">gate</text>
<rect x="244" y="778" width="16" height="14" rx="2" class="data" fill="none" stroke="#5F6D82" stroke-width="1.2" stroke-dasharray="4 3"/>
