<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 506" width="360" height="506" role="img" aria-labelledby="drill-title drill-desc" class="dg" font-family="Archivo, system-ui, sans-serif">
<title id="drill-title">Every number lands on a message</title>
<desc id="drill-desc">A figure on the dashboard opens its formula: a counted part, email actions times published minutes, and an estimated part, rounds times the bounded estimate. Each count opens the list of messages it was counted from, and the estimate opens the quotes it cites. Any message opens in the viewer, fetched by its ID with the quote marked at its stored offsets. The viewer gets the raw bytes from the corpus reader, from disk on macOS and Linux or Git objects on Windows, and git show HEAD with the ID prints the same bytes for your own check.</desc>
<defs><pattern id="drill-hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><rect class="hatch-bg" width="5" height="5" fill="#FFFFFF"/><line class="hatch-ln" x1="0" y1="0" x2="0" y2="5" stroke="#0B3C86" stroke-width="1.6"/></pattern></defs>
<rect x="8" y="8" width="344" height="44" rx="3" class="code" fill="#FFFFFF" stroke="#A9B5C3" stroke-width="1.2"/>
<text x="20" y="26" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">A figure on the dashboard</text>
<text x="20" y="43" class="s" font-size="12" fill="#3D4B5D">a process’s automatable dollars a month</text>
<path class="arrow" d="M180 52 V66" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M176 65 L184 65 L180 72 Z" fill="#5F6D82"/>
<rect x="8" y="72" width="344" height="44" rx="3" class="code" fill="#FFFFFF" stroke="#A9B5C3" stroke-width="1.2"/>
<text x="20" y="90" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">Its formula</text>
<text x="20" y="107" class="s" font-size="12" fill="#3D4B5D">a counted part plus an estimated part</text>
<path class="arrow" d="M150 116 V126 H92 V129" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M88 129 L96 129 L92 136 Z" fill="#5F6D82"/>
<path class="arrow" d="M210 116 V126 H268 V129" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M264 129 L272 129 L268 136 Z" fill="#5F6D82"/>
<rect x="8" y="136" width="168" height="58" rx="3" class="code" fill="#FFFFFF" stroke="#A9B5C3" stroke-width="1.2"/>
<rect class="sw-c" x="8" y="136" width="8" height="58" fill="#0B3C86"/>
<text x="26" y="155" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">Counted part</text>
<text x="26" y="172" class="s" font-size="12" fill="#3D4B5D">email actions times</text>
<text x="26" y="187" class="s" font-size="12" fill="#3D4B5D">published minutes</text>
<rect x="184" y="136" width="168" height="58" rx="3" class="code" fill="#FFFFFF" stroke="#A9B5C3" stroke-width="1.2"/>
<rect class="sw-e" x="184" y="136" width="8" height="58" fill="url(#drill-hatch)" stroke="#0B3C86" stroke-width="1"/>
<text x="202" y="155" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">Estimated part</text>
<text x="202" y="172" class="s" font-size="12" fill="#3D4B5D">rounds times the</text>
<text x="202" y="187" class="s" font-size="12" fill="#3D4B5D">bounded estimate</text>
<path class="arrow" d="M92 194 V208" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M88 207 L96 207 L92 214 Z" fill="#5F6D82"/>
<path class="arrow" d="M268 194 V208" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M264 207 L272 207 L268 214 Z" fill="#5F6D82"/>
<rect x="8" y="214" width="168" height="58" rx="3" class="code" fill="#FFFFFF" stroke="#A9B5C3" stroke-width="1.2"/>

<text x="26" y="233" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">Its messages</text>
<text x="26" y="250" class="s" font-size="12" fill="#3D4B5D">each count opens</text>
<text x="26" y="265" class="s" font-size="12" fill="#3D4B5D">the list it counts</text>
<rect x="184" y="214" width="168" height="58" rx="3" class="code" fill="#FFFFFF" stroke="#A9B5C3" stroke-width="1.2"/>

<text x="202" y="233" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">Its quotes</text>
<text x="202" y="250" class="s" font-size="12" fill="#3D4B5D">the evidence the</text>
<text x="202" y="265" class="s" font-size="12" fill="#3D4B5D">estimate cites</text>
<path class="arrow" d="M92 272 V282 H150 V285" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M146 285 L154 285 L150 292 Z" fill="#5F6D82"/>
<path class="arrow" d="M268 272 V282 H210 V285" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M206 285 L214 285 L210 292 Z" fill="#5F6D82"/>
<rect x="8" y="292" width="344" height="44" rx="3" class="code" fill="#FFFFFF" stroke="#A9B5C3" stroke-width="1.2"/>
<text x="20" y="310" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">The message viewer</text>
<text x="20" y="327" class="m s" font-size="11.5" fill="#3D4B5D" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">/api/message?id=&lt;id&gt;, quote marked</text>
<path class="arrow" d="M180 336 V350" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M176 349 L184 349 L180 356 Z" fill="#5F6D82"/>
<rect x="8" y="356" width="344" height="44" rx="3" class="code" fill="#FFFFFF" stroke="#A9B5C3" stroke-width="1.2"/>
<text x="20" y="374" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">The corpus reader</text>
<text x="20" y="391" class="s" font-size="12" fill="#3D4B5D">disk on macOS and Linux, Git objects on Windows</text>
<path class="arrow" d="M180 400 V414" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M176 413 L184 413 L180 420 Z" fill="#5F6D82"/>
<rect x="8" y="420" width="344" height="44" rx="12" class="data" fill="none" stroke="#5F6D82" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="20" y="438" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">Your own check</text>
<text x="20" y="455" class="m s" font-size="11.5" fill="#3D4B5D" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace">git show HEAD:&quot;&lt;id&gt;&quot;</text>
<g class="legend">
<rect x="8" y="480" width="16" height="14" fill="#0B3C86" class="sw-c"/>
<text x="30" y="492" class="l" font-size="12.5" fill="#3D4B5D">counted</text>
<rect x="100" y="480" width="16" height="14" fill="url(#drill-hatch)" stroke="#0B3C86" stroke-width="1" class="sw-e"/>
<text x="122" y="492" class="l" font-size="12.5" fill="#3D4B5D">estimated</text>
</g>
</svg>
