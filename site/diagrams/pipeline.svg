<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 774" width="360" height="774" role="img" aria-labelledby="pipeline-title pipeline-desc" class="dg" font-family="Archivo, system-ui, sans-serif">
<title id="pipeline-title">From the archive to the dashboard</title>
<desc id="pipeline-desc">The pipeline from top to bottom. The /observe skill runs one command per turn and drives every step. The corpus, in Git objects or on disk, is read by the corpus reader; prepare parses, de-duplicates, threads and batches it; one taxonomist call proposes the processes, accepted by code; 99 extractor jobs, 20 at a time, tag every message with quotes, checked by the quote gate; one merger call places the proposed keys, checked by code; the rollup counts; synthesizers in one wave describe each process and estimate its work, checked against bounds; score prices counted and estimated parts at $85 an hour; up to 8 drafters write documents, checked by the draft gate; build writes the dashboard data and the report; serve shows the dashboard on 127.0.0.1.</desc>
<rect x="8" y="6" width="344" height="50" rx="4" class="orch" fill="none" stroke="#0B3C86" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="20" y="27" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">The /observe skill: the orchestrator</text>
<text x="20" y="45" class="s" font-size="12" fill="#3D4B5D">one command per turn runs every step below</text>
<g class="row">
<rect x="8" y="72" width="246" height="42" rx="12" class="data" fill="none" stroke="#5F6D82" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="20" y="90" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">The corpus</text>
<text x="20" y="106" class="s" font-size="12" fill="#3D4B5D">in Git objects or on disk</text>
</g>
<path class="arrow" d="M131 114 V122" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M127 121 L135 121 L131 128 Z" fill="#5F6D82"/>
<g class="row">
<rect x="8" y="128" width="246" height="42" rx="3" class="code" fill="#FFFFFF" stroke="#A9B5C3" stroke-width="1.2"/>
<text x="20" y="146" class="t" font-size="14.5" font-weight="600" fill="#0F1B2D">Corpus reader</text>
<text x="20" y="162" class="s" font-size="12" fill="#3D4B5D">the same bytes from either source</text>
</g>
<path class="arrow" d="M131 170 V178" fill="none" stroke="#5F6D82" stroke-width="1.4"/><path class="head" d="M127 177 L135 177 L131 184 Z" fill="#5F6D82"/>
