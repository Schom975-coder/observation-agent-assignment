<text x="20" y="274" class="s" font-size="12" fill="#3D4B5D">the list of recurring processes</text>
<rect x="266" y="246" width="86" height="30" rx="15" class="gate" fill="#FBF1D6" stroke="#A57700" stroke-width="1.4"/>
<text x="309" y="265" class="k" font-size="11.5" font-weight="600" fill="#0F1B2D" text-anchor="middle">accept</text>
